# Blueprint Render — Qui Diogo Baby Shower Quiz
# Web Service Next.js gratuito + base de dados PostgreSQL gratuita.
#
# Para usar: Dashboard Render → New → Blueprint → liga este repositório.
# Se o serviço tiver sido criado à mão ("New → Web Service"), o Render
# IGNORA este ficheiro e usa o que estiver escrito no dashboard.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: qui-diogo
    runtime: node
    plan: free
    region: frankfurt          # região mais próxima de Portugal
    branch: master
    # Cada push para master volta a fazer build e publica sozinho.
    autoDeploy: true

    # O build não toca na base de dados: só instala e compila. Assim um
    # problema de ligação nunca faz falhar a compilação.
    #
    # --include=dev é obrigatório: com NODE_ENV=production (definido abaixo)
    # o npm pode omitir as devDependencies, e é lá que estão o typescript e
    # os @types. Sem eles o "next build" falha na verificação de tipos.
    buildCommand: npm install --include=dev && npm run build

    # As migrações correm ao arrancar. São idempotentes (CREATE ... IF NOT
    # EXISTS), por isso podem correr em todos os arranques sem estragar nada.
    startCommand: npm run migrate && npm run start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production
      # PORT é injetado automaticamente pelo Render — não o fixes aqui.
      - key: DATABASE_URL
        fromDatabase:
          name: qui-diogo-db
          property: connectionString
      # Sem isto, a password de administração fica a que está no código.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true

databases:
  - name: qui-diogo-db
    plan: free
    databaseName: quidiogo
    user: quidiogo
    region: frankfurt
